name: PV blueprint harness

on:
  pull_request:
    branches: [feat/pv-measurement-freshness-current]
    paths:
      - ".github/workflows/pv-blueprint-harness.yaml"
      - "example/blueprint/automation/go-echarger-pv-surplus-data.yaml"
      - "tests/blueprint_harness/**"

permissions:
  contents: read

jobs:
  blueprint-timing:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: tests/blueprint_harness/requirements.txt
      - name: Install the harness and Home Assistant test plugin
        run: |
          python -m pip install -r tests/blueprint_harness/requirements.txt
          python -m pip show homeassistant ha-blueprint-test-harness | grep -E '^(Name|Version):'
      - name: Test the unmodified blueprint
        run: python -m pytest -c tests/blueprint_harness/pytest.ini tests/blueprint_harness -q
      - name: Verify the tests catch both regressions
        run: python tests/blueprint_harness/check_mutations.py
